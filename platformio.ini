; ARQUIS EV DIAGNOSTIC — PlatformIO configuration
; Target: ESP32-S3-N16R8 (16 MB Flash QIO, 8 MB Octal PSRAM) on a DevKit with USB.
;
; NOTE: Board settings below follow the usual N16R8 DevKitC-1 clone profile and
; have NOT been validated on the physical board yet (see docs/TESTING.md).

[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
; Pinned to the version used on the validated hardware (Arduino core 2.0.17) so
; every machine builds with the same toolchain. Update deliberately, not by drift.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory profile: 16 MB Flash + 8 MB Octal PSRAM (N16R8) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries are added per stage as modules are implemented.
; Stage 1: ILI9341 display. Pins are passed at runtime from src/config/pins_config.h.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.1
    ; Stage 3: BLE analyzer (read-only scan + GATT exploration)
    h2zero/NimBLE-Arduino@^2.1.0
