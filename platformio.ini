; ARQUIS EV DIAGNOSTIC — PlatformIO configuration
; Target: ESP32-S3-N16R8 (16 MB Flash QIO, 8 MB Octal PSRAM) on a DevKit with USB.
;
; NOTE: Board settings below follow the usual N16R8 DevKitC-1 clone profile and
; have NOT been validated on the physical board yet (see docs/TESTING.md).

[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory profile: 16 MB Flash + 8 MB Octal PSRAM (N16R8) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries are added per stage as modules are implemented. None yet.
; lib_deps =
